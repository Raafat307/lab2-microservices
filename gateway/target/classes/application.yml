server:
  port: 8080

spring:
  application:
    name: gateway-service

services:
  loyalty:
    url: http://localhost:8050
  payment:
    url: http://localhost:8060
  reservation:
    url: http://localhost:8070

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always