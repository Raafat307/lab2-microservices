server:
  port: 8050

spring:
  application:
    name: loyalty-service

  datasource:
    url: jdbc:postgresql://localhost:5432/balances
    username: program
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always